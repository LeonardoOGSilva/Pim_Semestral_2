<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxTech - Cadastro</title>

    <!-- Fonte de ícones e estilos comuns do site -->
    <link rel="shortcut icon" href="Imagens/Icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

    <!-- Cabeçalho com logo, pesquisa e navegação de retorno à página inicial -->
    <div class="top-bar">FRETE GRÁTIS EM HARDWARE ACIMA DE R$ 1.000</div>
    <header class="header">

        <a href="index.html" class="logo">
            Box<span>Tech</span>
        </a>

        <div class="search-bar">
            <input type="text" placeholder="O que você está procurando hoje?">
            <button>
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="header-icons">
            <a href="login.html" aria-label="Perfil"><i class="far fa-user" title="Perfil"></i></a>
            <a href="favoritos.html" aria-label="Favoritos"><i class="far fa-heart" title="Favoritos"></i></a>
            <a href="carrinho.html" aria-label="Carrinho"><i class="fas fa-shopping-cart" title="Carrinho"></i><span class="cart-badge" id="cart-badge" hidden>0</span></a>
            <a href="acessibilidade.html" aria-label="Acessibilidade"><i class="fas fa-universal-access" title="Acessibilidade"></i></a>
        </div>

    </header>

    <!-- Conteúdo principal com formulário de cadastro de usuário -->
    <main class="auth-wrapper">

        <div class="auth-card large">

            <h2 class="auth-title">Criar minha conta</h2>

            <!-- Formulário de cadastro com campos obrigatórios de usuário -->
            <form id="cadastro-form">

                <div class="form-row">

                    <div class="form-group">

                        <label>Nome*</label>

                        <input
                            type="text"
                            id="nome"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Sobrenome*</label>

                        <input
                            type="text"
                            id="sobrenome"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>CPF*</label>

                    <input
                        type="text"
                        id="cpf"
                        required
                        placeholder="000.000.000-00">

                </div>

                <div class="form-group">

                    <label>Email*</label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>

                <div class="form-group">

                    <label>Senha*</label>

                    <input
                        type="password"
                        id="senha"
                        required>

                </div>

                <div class="form-group">

                    <label>Confirme sua senha*</label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                    style="margin-top: 20px; width: 50%; margin-left: 25%;">

                    Confirmar

                </button>

            </form>

        </div>

    </main>

    <!-- Rodapé com informações institucionais e rede sociais -->
    <footer class="footer">

        <div class="footer-container">

            <div class="footer-column">

                <h3>Box<span>Tech</span></h3>

                <p>
                    A sua loja definitiva de hardware e periféricos de alta performance.
                    Desenvolvido para gamers e profissionais exigentes.
                </p>

                <div class="footer-socials">

                    <a href="institucional.html#contato" aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>

                    <a href="institucional.html#contato" aria-label="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>

                    <a href="institucional.html#contato" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>

                    <a href="institucional.html#contato" aria-label="YouTube">
                        <i class="fab fa-youtube"></i>
                    </a>

                </div>

            </div>

        </div>

        <div class="footer-bottom">

            <p>
                &copy; 2026 BoxTech Eletrônicos Ltda.
                Todos os direitos reservados.
                Projeto Acadêmico UNIP (PIM).
            </p>

        </div>

    </footer>

    <script src="api.js?v=6"></script>
    <script src="script.js?v=6"></script>
    <script src="pages.js?v=6"></script>

</body>
</html>
